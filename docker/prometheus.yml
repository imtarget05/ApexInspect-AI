global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'triton'
    static_configs:
      - targets: ['triton:8002']

  - job_name: 'apexinspect-train'
    static_configs:
      - targets: ['apexinspect-train:9090']

  - job_name: 'apexinspect-infer'
    static_configs:
      - targets: ['apexinspect-infer:8000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']