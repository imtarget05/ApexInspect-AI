# ApexInspect Training Configuration
# Usage: python scripts/train.py --config configs/train.yaml

model:
  name: "yolov8n"          # yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  num_classes: 10
  img_size: 640
  pretrained: true
  freeze_backbone: false
  confidence_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300

data:
  train_path: "data/yolo_format/images/train"
  val_path: "data/yolo_format/images/val"
  test_path: "data/yolo_format/images/test"
  class_names:
    - "scratch"
    - "dent"
    - "crack"
    - "corrosion"
    - "misalignment"
    - "contamination"
    - "burr"
    - "deformation"
    - "discoloration"
    - "foreign_object"
  batch_size: 16
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  augment: true
  mosaic: 1.0
  mixup: 0.1
  copy_paste: 0.3

augmentation:
  blur_prob: 0.1
  median_blur_prob: 0.1
  to_gray_prob: 0.1
  clahe_prob: 0.1
  noise_prob: 0.2
  brightness_contrast_prob: 0.3
  hue_saturation_prob: 0.2
  flip_prob: 0.5
  rotate_limit: 30
  scale_limit: 0.5
  translate_limit: 0.1

training:
  epochs: 100
  patience: 20
  learning_rate: 0.001
  weight_decay: 0.0005
  momentum: 0.937
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box_loss_gain: 7.5
  cls_loss_gain: 0.5
  dfl_loss_gain: 1.5
  label_smoothing: 0.0
  nbs: 64
  overlap_mask: true
  mask_ratio: 4
  dropout: 0.0
  val_interval: 1
  save_period: 10

optimizer:
  name: "SGD"
  lr: 0.001
  momentum: 0.937
  weight_decay: 0.0005
  nesterov: true

scheduler:
  name: "cosine"
  lr_final: 1e-6
  warmup_epochs: 3

export:
  format: "onnx"
  opset_version: 17
  dynamic_batch: true
  simplify: true
  half_precision: true
  workspace_size: 4294967296  # 4GB

tensorrt:
  precision: "fp16"  # fp32, fp16, int8
  max_batch_size: 8
  min_shape: [1, 3, 640, 640]
  opt_shape: [4, 3, 640, 640]
  max_shape: [8, 3, 640, 640]
  calibration_cache: "models/calibration.cache"

deployment:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  timeout: 30
  max_batch_size: 8
  max_queue_delay: 10
  enable_triton: true
  triton_http_port: 8000
  triton_grpc_port: 8001
  triton_metrics_port: 8002

logging:
  level: "INFO"
  format: "json"
  file: "logs/apexinspect.log"
  mlflow_uri: "http://mlflow:5000"
  wandb_project: "apexinspect"
  wandb_entity: null

seed: 42
device: "auto"
output_dir: "outputs"
experiment_name: "apexinspect-industrial"