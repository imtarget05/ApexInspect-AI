# CI-live — ApexInspect-AI live/infra tests. MANUAL TRIGGER ONLY
# (workflow_dispatch): these tests need a live LLM gateway / model endpoint or
# live infra (DB, Qdrant, PLC) and must never run on push/PR. No coverage gate.
name: CI-live (manual — live/infra tests)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-tests:
    name: Live/infra tests (manual trigger only)
    runs-on: ubuntu-latest
    env:
      LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run live/infra tests (no fail-under)
        run: python -m pytest tests/ -q --tb=short -m "live or infra" --strict-markers
