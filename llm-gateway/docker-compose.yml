services:
  llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      # Overrides .env so the published port is reachable from outside the container.
      GATEWAY_HOST: "0.0.0.0"
    # Lets the container reach an LLM running on the Docker host or the LAN.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Keep telemetry across container recreates.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health/ready', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
