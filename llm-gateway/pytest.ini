[pytest]
pythonpath = .
testpaths = tests
markers =
    adversarial: OWASP-LLM prompt-injection / transparency probes
    race: stdlib threading races over quota and circuit-breaker state
    live: tests requiring a live gateway or LAN upstream (skipped offline)
    infra: live-infrastructure guards and connectivity probes
filterwarnings =
    ignore::DeprecationWarning

